_format_version: "3.0"
services:
  - name: agent-governance-api
    url: http://api:8000
    routes:
      - name: governance-route
        paths: ["/api/v1"]
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
      - name: rate-limiting
        config:
          minute: 120
          policy: local
